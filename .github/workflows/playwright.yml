name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: week05-saucedemo
            dir: Week05-Playwright-Automation
            test-cmd: npx playwright test
          - name: week07-orangehrm
            dir: Week07-OrangeHRM/playwright-automation
            test-cmd: npx playwright test
          - name: week08-demoblaze
            dir: Week08-Demoblaze-QA/playwright-automation
            test-cmd: npx playwright test
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: ${{ matrix.test-cmd }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.name }}
          path: ${{ matrix.dir }}/playwright-report/
          retention-days: 14