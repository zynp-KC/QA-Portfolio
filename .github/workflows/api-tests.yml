name: API Tests - Restful Booker

on:
  push:
    branches: [ main ]
    paths:
      - 'api-automation-restful-booker/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'api-automation-restful-booker/**'
      - '.github/workflows/api-tests.yml'

jobs:
  api-tests:
    name: api-restful-booker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api-automation-restful-booker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npx playwright test --config=playwright.api.config.ts

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-api
          path: api-automation-restful-booker/playwright-report/
          retention-days: 14